<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Пуэр Точка — Чайная для души и здоровья</title>
  <meta name="description" content="Пуэр Точка — чайная для души и здоровья. Коллекционный пуэр, классика тегуанинь и многое другое.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Пуэр Точка">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- фон -->
<div class="bg"></div>
<!-- пыль canvas -->
<canvas id="dust"></canvas>

<!-- PLAY экран (как в референсе) -->
<div id="playScreen">
  <div class="play-ring" id="playBtn">
    <span class="play-icon">▶</span>
  </div>
  <p class="play-hint">Нажмите, чтобы начать</p>
</div>

<!-- Слайдер -->
<main id="slider" class="slider">

  <!-- 1 — вывеска -->
  <section class="slide is-first" data-slide data-hue="198" style="--img:url('img/slide1.jpg')">
    <div class="slide__bg"></div><div class="slide__shade"></div>
    <div class="content">
      <h1 class="neon n-cyan fit" data-anim="top" data-delay="0">ПУЭР ТОЧКА</h1>
      <p  class="neon n-gold sub" data-anim="up"  data-delay="220">Чайная для души и здоровья <span class="emo">💪</span></p>
    </div>
  </section>

  <!-- 2 — витрина, чаи → Тегуанинь -->
  <section class="slide" data-slide data-hue="42" style="--img:url('img/slide2.jpg')">
    <div class="slide__bg"></div><div class="slide__shade"></div>
    <div class="content">
      <span class="neon n-gold eyebrow" data-anim="left" data-delay="0">Классика</span>
      <h2  class="neon n-cyan fit"     data-anim="top"  data-delay="160">Тегуанинь</h2>
    </div>
  </section>

  <!-- 3 — блин пуэра в коробке → Пуэр -->
  <section class="slide" data-slide data-hue="330" style="--img:url('img/slide3.jpg')">
    <div class="slide__bg"></div><div class="slide__shade"></div>
    <div class="content">
      <span class="neon n-gold eyebrow" data-anim="left" data-delay="0">Коллекция</span>
      <h2  class="neon n-rose fit"     data-anim="top"  data-delay="160">Пуэр</h2>
      <p   class="neon n-cyan sub"     data-anim="up"   data-delay="340">Коллекционный, выдержанный</p>
    </div>
  </section>

  <!-- 4 -->
  <section class="slide" data-slide data-hue="198" style="--img:url('img/slide4.jpg')">
    <div class="slide__bg"></div><div class="slide__shade"></div>
    <div class="content">
      <h2 class="neon n-cyan fit" data-anim="top" data-delay="0">…и многое другое</h2>
      <p  class="neon n-gold sub" data-anim="up"  data-delay="200">Целый мир вкуса ждёт вас</p>
    </div>
  </section>

  <!-- 5 -->
  <section class="slide" data-slide data-hue="42" style="--img:url('img/slide5.jpg')">
    <div class="slide__bg"></div><div class="slide__shade"></div>
    <div class="content">
      <span class="neon n-rose eyebrow" data-anim="left" data-delay="0">Мастерство</span>
      <h2  class="neon n-gold fit"     data-anim="top"  data-delay="160">Изысканный вкус от мастера</h2>
    </div>
  </section>

  <!-- 6 -->
  <section class="slide" data-slide data-hue="330" style="--img:url('img/slide6.jpg')">
    <div class="slide__bg"></div><div class="slide__shade"></div>
    <div class="content">
      <h2 class="neon n-rose fit" data-anim="top" data-delay="0">Вайб обеспечен <span class="emo">🚀</span></h2>
    </div>
  </section>

  <!-- 7 -->
  <section class="slide" data-slide data-hue="198" style="--img:url('img/slide7.jpg')">
    <div class="slide__bg"></div><div class="slide__shade"></div>
    <div class="content">
      <h1 class="neon n-cyan fit" data-anim="top" data-delay="0">ПУЭР ТОЧКА</h1>
      <p  class="neon n-gold sub" data-anim="up"  data-delay="220">Ждём вас в гости <span class="emo">🍵</span></p>
    </div>
  </section>

  <div class="progress"><span class="progress__bar" id="pbar"></span></div>
  <button class="tz tz--prev" type="button" aria-label="Назад"></button>
  <button class="tz tz--next" type="button" aria-label="Далее"></button>
  <nav class="dots" id="dots"></nav>
</main>

<script src="app.js"></script>
</body>
</html>
