<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Курбан-байрам Мубарак</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,0.004) 3px,rgba(255,255,255,0.004) 4px);
  pointer-events:none;z-index:3;
}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 50%,#06020e 0%,#020108 45%,#000 100%);z-index:0}
canvas{position:fixed;inset:0;z-index:5;pointer-events:none}

/* ── HINT (identical to liberté) ── */
#hint{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  transition:opacity 0.5s ease;
}
.ring{
  width:90px;height:90px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.25);
  display:flex;align-items:center;justify-content:center;
  animation:rp 2s ease-in-out infinite;
}
.ring::after{content:'▶';font-size:32px;color:rgba(255,255,255,0.5);margin-left:5px}
@keyframes rp{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,0.15)}
  50%{transform:scale(1.1);box-shadow:0 0 0 22px rgba(255,255,255,0)}
}
#hint p{font-family:-apple-system,Helvetica,sans-serif;font-size:12px;color:rgba(255,255,255,0.3);letter-spacing:5px;text-transform:uppercase}

/* ── CONTENT (identical layout to liberté) ── */
.content{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;width:100%;padding:0 4vw;
  gap:clamp(2px,1vw,10px);
}
.neon{
  font-family:'Russo One','Impact',sans-serif;
  opacity:0;display:block;
  will-change:transform,opacity,filter;
  white-space:nowrap;
  transform:translateZ(0);-webkit-transform:translateZ(0);
}

/* Font sizes — same proportions as liberté l1/l2/l3 */
#l1{font-size:clamp(40px,11vw,104px);line-height:1.1;}
#l2{font-size:clamp(30px,8.5vw,78px);line-height:1.14;}
#l3{font-size:clamp(36px,10vw,94px);line-height:1.08;}

/* ── ENTRY ANIMATIONS — exact copy from liberté ── */
@keyframes fromLeft{
  0%  {opacity:0;transform:translateX(-130px) skewX(12deg) translateZ(0);filter:blur(6px)}
  55% {opacity:1;transform:translateX(14px) skewX(-3deg) translateZ(0);filter:blur(0)}
  75% {transform:translateX(-6px) skewX(1deg) translateZ(0)}
  100%{opacity:1;transform:translateX(0) skewX(0) translateZ(0);filter:blur(0)}
}
@keyframes fromTop{
  0%  {opacity:0;transform:translateY(-110px) scale(.82) translateZ(0);filter:blur(5px)}
  58% {opacity:1;transform:translateY(12px) scale(1.03) translateZ(0);filter:blur(0)}
  78% {transform:translateY(-5px) scale(.99) translateZ(0)}
  100%{opacity:1;transform:translateY(0) scale(1) translateZ(0);filter:blur(0)}
}
@keyframes fromRight{
  0%  {opacity:0;transform:translateX(130px) skewX(-12deg) translateZ(0);filter:blur(6px)}
  55% {opacity:1;transform:translateX(-14px) skewX(3deg) translateZ(0);filter:blur(0)}
  75% {transform:translateX(6px) skewX(-1deg) translateZ(0)}
  100%{opacity:1;transform:translateX(0) skewX(0) translateZ(0);filter:blur(0)}
}
@keyframes fadeOut{
  0%  {opacity:1;filter:blur(0);transform:scale(1)}
  100%{opacity:0;filter:blur(5px);transform:scale(.93)}
}

/* ── LOOP ANIMATIONS — same as liberté, plus extras ── */
@keyframes neonFlicker{
  0%,14%,16%,18%,27%,49%,94%,100%{
    color:#ecfaff;
    text-shadow:0 0 4px #fff,0 0 10px #d0f4ff,0 0 22px #44c8ff,0 0 48px #009ee0,0 0 90px #0068b8,0 0 160px rgba(0,75,195,.38)
  }
  15%,50%{color:rgba(236,250,255,.05);text-shadow:none}
  17%{color:rgba(236,250,255,.38);text-shadow:0 0 4px rgba(68,200,255,.2)}
}
@keyframes goldBreathe{
  0%,100%{color:#fff9e8;text-shadow:0 0 4px #fff,0 0 10px #fff0a0,0 0 22px #ffc020,0 0 48px #de7c00,0 0 90px #9e4c00,0 0 150px rgba(165,58,0,.38)}
  50%{text-shadow:0 0 8px #fff,0 0 18px #fffcc0,0 0 38px #ffd040,0 0 75px #e88e00,0 0 140px #be5e00,0 0 238px rgba(205,78,0,.55)}
}
@keyframes rosePulse{
  0%,100%{color:#fff0f6;text-shadow:0 0 4px #fff,0 0 10px #ffbad6,0 0 22px #ff509e,0 0 48px #de0668,0 0 90px #9e0046,0 0 150px rgba(162,0,63,.38)}
  50%{text-shadow:0 0 9px #fff,0 0 18px #ffd4ea,0 0 42px #ff70b4,0 0 82px #e81876,0 0 148px #be005c,0 0 252px rgba(198,0,88,.55)}
}
@keyframes whitePulse{
  0%,100%{color:#fff;text-shadow:0 0 4px #fff,0 0 12px rgba(255,255,255,.9),0 0 28px rgba(255,255,255,.6),0 0 64px rgba(255,255,255,.35)}
  50%{text-shadow:0 0 8px #fff,0 0 24px #fff,0 0 54px rgba(255,255,255,.9),0 0 110px rgba(255,255,255,.5)}
}
@keyframes cyanPulse{
  0%,100%{color:#d8fff8;text-shadow:0 0 4px #fff,0 0 10px #90ffe8,0 0 22px #00ffc8,0 0 48px #00bfa0,0 0 90px #006860,0 0 180px rgba(0,80,60,.4)}
  50%{text-shadow:0 0 10px #fff,0 0 22px #b0fff0,0 0 44px #40ffe0,0 0 90px #00d0b0,0 0 180px #008878}
}
@keyframes purpPulse{
  0%,100%{color:#eedcff;text-shadow:0 0 4px #fff,0 0 10px #cc90ff,0 0 22px #9c40ff,0 0 48px #6800d8,0 0 90px #3c0080}
  50%{text-shadow:0 0 8px #fff,0 0 20px #deb0ff,0 0 44px #bc60ff,0 0 90px #8820e8,0 0 160px #5800a8}
}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="c"></canvas>

<div id="hint">
  <div class="ring"></div>
  <p>Tap anywhere</p>
</div>

<div class="content">
  <span class="neon" id="l1"></span>
  <span class="neon" id="l2"></span>
  <span class="neon" id="l3"></span>
</div>

<script>
(function(){
  /* ═══════════════════════════════
     PARTICLE ENGINE — identical to liberté
  ═══════════════════════════════ */
  var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  function rsz(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  rsz();window.addEventListener('resize',rsz);

  var HUES=[198,42,330];
  var amb=Array.from({length:60},function(_,i){
    return{
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      r:Math.random()*1.4+.2,
      vx:(Math.random()-.5)*.18,
      vy:-(Math.random()*.22+.05),
      alpha:Math.random()*.3+.05,
      hue:HUES[i%3],
      phase:Math.random()*Math.PI*2
    };
  });
  var bursts=[];

  function burst(x,y,hue,n){
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2,s=Math.random()*8+2;
      bursts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,r:Math.random()*3.2+.5,alpha:1,hue:hue,decay:Math.random()*.01+.011,grav:.14});
    }
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var W=window.innerWidth,H=window.innerHeight;
    amb.forEach(function(p){
      p.phase+=.015;p.x+=p.vx+Math.sin(p.phase)*.18;p.y+=p.vy;
      if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
      if(p.x<-10||p.x>W+10){p.x=Math.random()*W;p.y=H+10;}
      ctx.save();ctx.shadowBlur=10;ctx.shadowColor='hsl('+p.hue+',88%,70%)';
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='hsla('+p.hue+',88%,75%,'+p.alpha+')';ctx.fill();ctx.restore();
    });
    bursts=bursts.filter(function(p){return p.alpha>.01;});
    bursts.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=.968;p.alpha-=p.decay;p.r*=.983;
      ctx.save();ctx.shadowBlur=20;ctx.shadowColor='hsl('+p.hue+',95%,65%)';
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.1,p.r),0,Math.PI*2);
      ctx.fillStyle='hsla('+p.hue+',95%,80%,'+p.alpha+')';ctx.fill();ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();

  /* ═══════════════════════════════
     FONT FIT — identical to liberté
  ═══════════════════════════════ */
  function fit(){
    document.querySelectorAll('.neon').forEach(function(el){
      el.style.fontSize='';
      requestAnimationFrame(function(){
        var mw=window.innerWidth*.88;
        if(el.scrollWidth>mw){
          var c=parseFloat(getComputedStyle(el).fontSize);
          el.style.fontSize=(c*(mw/el.scrollWidth))+'px';
        }
      });
    });
  }
  window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}else{setTimeout(fit,300);}

  /* ═══════════════════════════════
     SCENE DATA
     4 scenes × 3 big lines = exactly like liberté
  ═══════════════════════════════ */
  var SCENES=[
    // ── Scene 1 ──
    [
      {t:'2 миллиона людей.',            a:'fromLeft',  h:198, lp:'neonFlicker', ld:9000},
      {t:'Разные языки, страны, судьбы —', a:'fromTop',  h:42,  lp:'goldBreathe', ld:8000},
      {t:'и все движутся в одну точку',   a:'fromRight', h:330, lp:'rosePulse',   ld:8500}
    ],
    // ── Scene 2 ──
    [
      {t:'как данные в единую систему.',  a:'fromLeft',  h:198, lp:'neonFlicker', ld:9000},
      {t:'Ни один алгоритм не объяснит — ', a:'fromTop', h:42,  lp:'goldBreathe', ld:8000},
      {t:'только вера. ☝️',               a:'fromRight', h:330, lp:'rosePulse',   ld:8500}
    ],
    // ── Scene 3 ──
    [
      {t:'Это живой код Всевышнего,',     a:'fromLeft',  h:280, lp:'purpPulse',   ld:9000},
      {t:'1400 лет без единого сбоя.',    a:'fromTop',   h:42,  lp:'goldBreathe', ld:8000},
      {t:'Мы часть этой системы. ✊',      a:'fromRight', h:330, lp:'rosePulse',   ld:8500}
    ],
    // ── Scene 4 — FINALE ──
    [
      {t:'Курбан-байрам Мубарак, умма! 🕋🤲', a:'fromLeft',  h:60,  lp:'whitePulse', ld:9000},
      {t:'пусть Он примет от всех нас.',       a:'fromTop',   h:42,  lp:'goldBreathe',ld:8000},
      {t:'@islam_dag_ai',                       a:'fromRight', h:165, lp:'cyanPulse',  ld:3500,
        href:'https://t.me/islam_dag_ai'}
    ]
  ];

  /* ═══════════════════════════════
     ANIMATION ENGINE
  ═══════════════════════════════ */
  var l1=document.getElementById('l1');
  var l2=document.getElementById('l2');
  var l3=document.getElementById('l3');
  var els=[l1,l2,l3];

  var DUR=1100, GAP=1200, HOLD=2000, FADE=650;

  function cx(){return window.innerWidth/2;}
  function cy(){return window.innerHeight/2;}
  function topY(){return cy()-window.innerHeight*.16;}
  function midY(){return cy();}
  function botY(){return cy()+window.innerHeight*.16;}
  var yFns=[topY,midY,botY];

  /* Animate one line in */
  function animIn(el,sd,yFn,delay){
    setTimeout(function(){
      el.style.animation=sd.a+' '+DUR+'ms cubic-bezier(.22,1,.36,1) forwards';
      setTimeout(function(){burst(cx(),yFn(),sd.h,90);},Math.round(DUR*.62));
      setTimeout(function(){
        el.style.opacity='1';
        el.style.transform='none';
        el.style.animation=sd.lp+' '+sd.ld+'ms ease-in-out infinite';
      },DUR+80);
    },delay);
  }

  /* Set up scene content & reset elements */
  function loadScene(sc){
    els.forEach(function(el,i){
      el.style.animation='none';
      el.style.opacity='0';
      el.style.transform='none';
      el.style.filter='none';
      el.style.fontSize='';
      el.style.cursor='';
      el.onclick=null;
      el.textContent=sc[i].t;
      if(sc[i].href){
        el.style.cursor='pointer';
        (function(href){el.onclick=function(){window.open(href,'_blank');};})(sc[i].href);
      }
    });
    /* force reflow so scrollWidth is accurate */
    els[0].offsetHeight;
    /* fit fonts */
    els.forEach(function(el){
      var mw=window.innerWidth*.88;
      if(el.scrollWidth>mw){
        var fs=parseFloat(getComputedStyle(el).fontSize);
        el.style.fontSize=(fs*(mw/el.scrollWidth))+'px';
      }
    });
  }

  /* Fade all lines out */
  function fadeAll(cb){
    els.forEach(function(el){
      el.style.animation='fadeOut '+FADE+'ms ease forwards';
    });
    setTimeout(cb,FADE+50);
  }

  /* Play one scene */
  function playScene(sc,isFinal){
    loadScene(sc);
    animIn(l1,sc[0],yFns[0],0);
    animIn(l2,sc[1],yFns[1],GAP);
    animIn(l3,sc[2],yFns[2],GAP*2);
    if(!isFinal){
      /* hold after all lines land, then fade */
      var holdAt=GAP*2+DUR+80+HOLD;
      setTimeout(function(){fadeAll(nextScene);},holdAt);
    }
  }

  /* Scene runner */
  var sceneIdx=0;
  function nextScene(){
    if(sceneIdx>=SCENES.length)return;
    var isFinal=(sceneIdx===SCENES.length-1);
    playScene(SCENES[sceneIdx],isFinal);
    sceneIdx++;
  }

  /* ═══════════════════════════════
     START — tap anywhere (identical to liberté)
  ═══════════════════════════════ */
  var done=false;
  var hint=document.getElementById('hint');
  function go(){
    if(done)return;done=true;
    hint.style.opacity='0';
    setTimeout(function(){hint.style.display='none';},500);
    setTimeout(nextScene,100);
  }
  document.addEventListener('click',go,{once:true});
  document.addEventListener('touchstart',go,{once:true,passive:true});

  /* ═══════════════════════════════
     PWA
  ═══════════════════════════════ */
  if('serviceWorker'in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  }
})();
</script>
</body>
</html>
