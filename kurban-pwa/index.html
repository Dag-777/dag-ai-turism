.overlay{position:fixed;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(0,0,0,.82) 0%,rgba(0,0,0,.58) 28%,rgba(0,0,0,.52) 55%,rgba(0,0,0,.82) 100%)}
.scan{position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.004) 3px,rgba(255,255,255,.004) 4px)}
canvas{position:fixed;inset:0;z-index:5;pointer-events:none}
#hint{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .5s ease}
.ring{width:90px;height:90px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;animation:rp 2s ease-in-out infinite}
.ring::after{content:'▶';font-size:32px;color:rgba(255,255,255,.5);margin-left:5px}
@keyframes rp{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.15)}50%{transform:scale(1.1);box-shadow:0 0 0 22px rgba(255,255,255,0)}}
#hint p{font-family:-apple-system,sans-serif;font-size:12px;color:rgba(255,255,255,.3);letter-spacing:5px;text-transform:uppercase}
.content{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4vw;gap:clamp(2px,1.2vw,12px)}
.neon{font-family:'Exo 2','Helvetica Neue',sans-serif;font-weight:300;display:inline-block;opacity:0;will-change:transform,opacity;white-space:nowrap;transform:translateZ(0);-webkit-transform:translateZ(0);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
#l1{font-size:clamp(36px,10vw,96px);line-height:1.1}
#l2{font-size:clamp(28px,7.8vw,74px);line-height:1.14}
#l3{font-size:clamp(32px,9vw,88px);line-height:1.08}
@keyframes fromLeft{0%{opacity:0;transform:translateX(-130px) skewX(12deg) translateZ(0);filter:blur(6px)}55%{opacity:1;transform:translateX(14px) skewX(-3deg) translateZ(0);filter:blur(0)}75%{transform:translateX(-6px) skewX(1deg) translateZ(0)}100%{opacity:1;transform:translateX(0) skewX(0) translateZ(0);filter:blur(0)}}
@keyframes fromTop{0%{opacity:0;transform:translateY(-110px) scale(.82) translateZ(0);filter:blur(5px)}58%{opacity:1;transform:translateY(12px) scale(1.03) translateZ(0);filter:blur(0)}78%{transform:translateY(-5px) scale(.99) translateZ(0)}100%{opacity:1;transform:translateY(0) scale(1) translateZ(0);filter:blur(0)}}
@keyframes fromRight{0%{opacity:0;transform:translateX(130px) skewX(-12deg) translateZ(0);filter:blur(6px)}55%{opacity:1;transform:translateX(-14px) skewX(3deg) translateZ(0);filter:blur(0)}75%{transform:translateX(6px) skewX(-1deg) translateZ(0)}100%{opacity:1;transform:translateX(0) skewX(0) translateZ(0);filter:blur(0)}}
@keyframes scOut{0%{opacity:1}100%{opacity:0;transform:scale(.93) translateZ(0)}}
@keyframes breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
@keyframes flicker{0%,13%,15%,17%,26%,48%,93%,100%{filter:brightness(1)}14%,49%{filter:brightness(0.05)}16%{filter:brightness(0.38)}}

(function(){
var C=document.getElementById('c'),ctx=C.getContext('2d');
function rsz(){C.width=innerWidth;C.height=innerHeight;}
rsz();addEventListener('resize',rsz);
var HUES=[198,42,330];
var amb=Array.from({length:60},function(_,i){return{x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+.2,vx:(Math.random()-.5)*.18,vy:-(Math.random()*.22+.05),alpha:Math.random()*.3+.05,hue:HUES[i%3],phase:Math.random()*Math.PI*2};});
var bursts=[];
function burst(x,y,hue,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=Math.random()*8+2;bursts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,r:Math.random()*3.2+.5,alpha:1,hue:hue,decay:Math.random()*.01+.011,grav:.14});}}
function draw(){
  ctx.clearRect(0,0,C.width,C.height);
  var W=innerWidth,H=innerHeight;
  amb.forEach(function(p){p.phase+=.015;p.x+=p.vx+Math.sin(p.phase)*.18;p.y+=p.vy;if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}if(p.x<-10||p.x>W+10){p.x=Math.random()*W;p.y=H+10;}ctx.save();ctx.shadowBlur=10;ctx.shadowColor='hsl('+p.hue+',88%,70%)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='hsla('+p.hue+',88%,75%,'+p.alpha+')';ctx.fill();ctx.restore();});
  bursts=bursts.filter(function(p){return p.alpha>.01;});
  bursts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=.968;p.alpha-=p.decay;p.r*=.983;ctx.save();ctx.shadowBlur=20;ctx.shadowColor='hsl('+p.hue+',95%,65%)';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.1,p.r),0,Math.PI*2);ctx.fillStyle='hsla('+p.hue+',95%,80%,'+p.alpha+')';ctx.fill();ctx.restore();});
  requestAnimationFrame(draw);
}
draw();
var G={
  blue:{core:'#ecfaff',c1:'#d0f4ff',c2:'#44c8ff',c3:'#009ee0',c4:'rgba(0,75,195,.35)'},
  gold:{core:'#fff9e8',c1:'#fff0a0',c2:'#ffc020',c3:'#de7c00',c4:'rgba(165,58,0,.35)'},
  pink:{core:'#fff0f6',c1:'#ffbad6',c2:'#ff509e',c3:'#de0668',c4:'rgba(162,0,63,.35)'},
  white:{core:'#fff',c1:'#fff',c2:'rgba(255,255,255,.85)',c3:'rgba(255,255,255,.5)',c4:'rgba(255,255,255,.2)'},
  cyan:{core:'#d8fff8',c1:'#90ffe8',c2:'#00ffc8',c3:'#00bfa0',c4:'rgba(0,80,60,.35)'},
  purp:{core:'#eedcff',c1:'#cc90ff',c2:'#9c40ff',c3:'#6800d8',c4:'rgba(60,0,128,.35)'}
};
function setGlow(el,g){
  var f=parseFloat(window.getComputedStyle(el).fontSize);
  var a=Math.max(2,Math.round(f*.10));
  var b=Math.max(4,Math.round(f*.26));
  var c=Math.max(8,Math.round(f*.56));
  var d=Math.max(14,Math.round(f*1.12));
  var e=Math.max(22,Math.round(f*2.10));
  el.style.color=g.core;
  el.style.textShadow='0 0 '+a+'px #fff,0 0 '+b+'px '+g.c1+',0 0 '+c+'px '+g.c2+',0 0 '+d+'px '+g.c3+',0 0 '+e+'px '+g.c4;
}
var l1=document.getElementById('l1'),l2=document.getElementById('l2'),l3=document.getElementById('l3');
var els=[l1,l2,l3];
function fitEl(el,initSz){
  if(initSz){el.style.fontSize=initSz;}else{el.style.fontSize='';}
  void el.offsetWidth;
  var mw=innerWidth*(initSz?.94:.88);
  if(el.scrollWidth>mw){var fs=parseFloat(window.getComputedStyle(el).fontSize);el.style.fontSize=Math.floor(fs*(mw/el.scrollWidth))+'px';}
}
var SC=[
  [{t:'2 миллиона людей.',      a:'fromLeft', g:'blue',lp:'flicker',ld:8900,h:198},
   {t:'Языки, страны, судьбы —', a:'fromTop',  g:'gold',lp:'breathe',ld:7500,h:42},
   {t:'к одной точке.',          a:'fromRight',g:'pink',lp:'breathe',ld:8500,h:330}],
  [{t:'Ни один алгоритм',        a:'fromLeft', g:'blue',lp:'flicker',ld:9000,h:198},
   {t:'не объяснит эту силу —',  a:'fromTop',  g:'gold',lp:'breathe',ld:7500,h:42},
   {t:'только вера. ☝️',         a:'fromRight',g:'pink',lp:'breathe',ld:8000,h:330}],
  [{t:'Живой код',              a:'fromLeft', g:'purp',lp:'breathe',ld:9000,h:280},
   {t:'Всевышнего.',             a:'fromTop',  g:'gold',lp:'breathe',ld:7500,h:42, sz:'22vw'},
   {t:'1400 лет без сбоя.',     a:'fromRight',g:'pink',lp:'breathe',ld:8500,h:330}],
  [{t:'Курбан-байрам Мубарак!',      a:'fromLeft', g:'gold',lp:'breathe',ld:9000,h:42},
   {t:'пусть Он примет нас. 🕋🤲',   a:'fromTop',  g:'gold',lp:'breathe',ld:7500,h:42},
   {t:'умма Ислама! ☪️',             a:'fromRight',g:'pink',lp:'breathe',ld:8500,h:330}]
];
var DUR=1100,GAP=1400,HOLD=2000,FADE=700;
function cx(){return innerWidth/2;}function cy(){return innerHeight/2;}
function yAt(i){return cy()+[-1,0,1][i]*innerHeight*.16;}
function animIn(el,sd,i,delay){
  setTimeout(function(){
    el.style.animation=sd.a+' '+DUR+'ms cubic-bezier(.22,1,.36,1) forwards';
    setTimeout(function(){burst(cx(),yAt(i),sd.h,90);},Math.round(DUR*.62));
    setTimeout(function(){
      el.style.opacity='1';el.style.transform='none';el.style.filter='none';
      setGlow(el,G[sd.g]);
      el.style.animation=sd.lp+' '+sd.ld+'ms ease-in-out infinite';
    },DUR+80);
  },delay);
}
function loadSc(sc){
  els.forEach(function(el,i){
    el.style.cssText='';el.id=['l1','l2','l3'][i];el.className='neon';
    el.textContent=sc[i].t;el.style.opacity='0';el.style.animation='none';
    el.style.transform='translateZ(0)';el.onclick=null;el.style.cursor='default';
    if(sc[i].sz){el.style.fontSize=sc[i].sz;}
    if(sc[i].href){(function(h){el.style.cursor='pointer';el.onclick=function(){window.open(h,'_blank');};})(sc[i].href);}
  });
  void l1.offsetHeight;els.forEach(function(el,i){fitEl(el,sc[i].sz);});
}
function fadeAll(cb){
  els.forEach(function(el){el.style.animation='scOut '+FADE+'ms ease forwards';});
  setTimeout(cb,FADE+60);
}
var idx=0;
function runNext(){
  if(idx>=SC.length)return;
  var sc=SC[idx++],fin=(idx>=SC.length);
  if(fin){var tg=document.getElementById('ig-tag');if(tg){tg.style.display='block';tg.style.animation='neonBlink 2400ms ease-in-out infinite';}}
  loadSc(sc);
  setTimeout(function(){
    animIn(l1,sc[0],0,0);animIn(l2,sc[1],1,GAP);animIn(l3,sc[2],2,GAP*2);
    if(!fin)setTimeout(function(){fadeAll(runNext);},GAP*2+DUR+80+HOLD);
  },50);
}
var started=false;
var hint=document.getElementById('hint');
function go(){
  if(started)return;started=true;
  var docEl=document.documentElement,rq=docEl.requestFullscreen||docEl.webkitRequestFullscreen||docEl.mozRequestFullScreen||docEl.msRequestFullscreen;
  if(rq)try{rq.call(docEl);}catch(e){}
  hint.style.transition='opacity .4s';hint.style.opacity='0';
  setTimeout(function(){hint.style.display='none';},420);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){setTimeout(runNext,80);});}
  else{setTimeout(runNext,400);}
}
document.addEventListener('click',go,{once:true});
document.addEventListener('touchstart',go,{once:true,passive:true});
if('serviceWorker'in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
})();
</script>
</body>
